[project]
name = "project-kit"
version = "0.1.0.dev0"
description = "Project definition and dev-workflow kit that hands off to Spec Kit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
project-kit = "project_kit.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
