[project]
name = "project-kit-cli"
version = "0.1.0"
description = "Project definition and dev-workflow kit that hands off to Spec Kit"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Tomás" }]
keywords = ["project-management", "spec-kit", "claude-code", "workflow", "github"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/miguelmatg/project-kit"
Issues = "https://github.com/miguelmatg/project-kit/issues"

[project.scripts]
project-kit = "project_kit.cli:main"

[tool.uv.build-backend]
# The distribution is project-kit-cli (the name free on PyPI); the package keeps its name.
module-name = "project_kit"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
