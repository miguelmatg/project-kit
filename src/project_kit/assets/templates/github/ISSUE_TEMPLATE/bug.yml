name: Bug
description: Something does not work as it should
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behaviour
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, tool versions
