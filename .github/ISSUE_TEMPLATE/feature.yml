name: Funcionalidad
description: Nueva funcionalidad o mejora
labels: ["type:feature"]
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Qué problema resuelve y por qué
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: notas
    attributes:
      label: Notas
