name: Release

# On every push to main, release-please keeps a "release PR" up to date from the Conventional
# Commits (feat, fix...). Merging that PR creates the tag and the GitHub release, and the
# publish job then uploads that exact version to PyPI.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Must match the trusted publisher registered in PyPI (workflow release.yml, environment pypi).
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - run: uv publish --trusted-publishing always
